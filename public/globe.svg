<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Radiant glow -->
  <circle cx="32" cy="32" r="28" fill="url(#globe-radial)" opacity="0.3"/>
  
  <!-- Main globe -->
  <circle cx="32" cy="32" r="24" fill="#42ffa1"/>
  <circle cx="32" cy="32" r="24" stroke="#131414" stroke-width="2"/>
  
  <!-- White inner circle -->
  <circle cx="32" cy="32" r="20" fill="#fff"/>
  
  <!-- Meridians -->
  <path d="M32 12C32 12 22 20 22 32C22 44 32 52 32 52" stroke="#131414" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 12C32 12 42 20 42 32C42 44 32 52 32 52" stroke="#131414" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Equator -->
  <ellipse cx="32" cy="32" rx="20" ry="8" stroke="#131414" stroke-width="1.5"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#131414" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Connection nodes -->
  <circle cx="20" cy="22" r="2" fill="#42ffa1"/>
  <circle cx="44" cy="26" r="2" fill="#42ffa1"/>
  <circle cx="38" cy="42" r="2" fill="#42ffa1"/>
  <circle cx="26" cy="44" r="2" fill="#42ffa1"/>
  
  <!-- Connection lines with glow -->
  <path d="M20 22L44 26" stroke="#42ffa1" stroke-width="1" opacity="0.4"/>
  <path d="M44 26L38 42" stroke="#42ffa1" stroke-width="1" opacity="0.4"/>
  <path d="M38 42L26 44" stroke="#42ffa1" stroke-width="1" opacity="0.4"/>
  
  <defs>
    <radialGradient id="globe-radial" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#42ffa1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#42ffa1" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
