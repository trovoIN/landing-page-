<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Radiant glow -->
  <circle cx="32" cy="32" r="28" fill="url(#shared-radial)" opacity="0.25"/>

  <!-- Two overlapping circles representing shared wallets -->
  <circle cx="26" cy="34" r="16" fill="#42ffa1"/>
  <circle cx="38" cy="30" r="16" fill="#42ffa1"/>
  <circle cx="26" cy="34" r="16" stroke="#131414" stroke-width="2"/>
  <circle cx="38" cy="30" r="16" stroke="#131414" stroke-width="2"/>

  <!-- Inner white area for contrast -->
  <circle cx="32" cy="32" r="12" fill="#fff"/>
  <circle cx="32" cy="32" r="12" stroke="#131414" stroke-width="1.5"/>

  <!-- Rupee symbol in the center -->
  <path d="M26 28H38M26 30H34M34 30C34 32 33 34 30 36L36 36" stroke="#131414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Split arrows showing distribution -->
  <path d="M32 44L24 48" stroke="#42ffa1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="48" r="2" fill="#42ffa1"/>
  <path d="M32 44L40 50" stroke="#42ffa1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="40" cy="50" r="2" fill="#42ffa1"/>

  <!-- Connection dots -->
  <circle cx="20" cy="26" r="2" fill="#42ffa1"/>
  <circle cx="48" cy="24" r="2" fill="#42ffa1"/>

  <defs>
    <radialGradient id="shared-radial" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#42ffa1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#42ffa1" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
