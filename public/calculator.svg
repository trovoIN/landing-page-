<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Radiant glow -->
  <rect x="10" y="2" width="44" height="60" rx="6" fill="url(#calc-radial)" opacity="0.2"/>
  
  <!-- Main calculator body -->
  <rect x="16" y="8" width="32" height="48" rx="3" fill="#42ffa1"/>
  <rect x="16" y="8" width="32" height="48" rx="3" stroke="#131414" stroke-width="2"/>
  
  <!-- Display screen -->
  <rect x="20" y="12" width="24" height="10" rx="1.5" fill="#fff"/>
  <rect x="20" y="12" width="24" height="10" rx="1.5" stroke="#131414" stroke-width="1.5"/>
  
  <!-- Display numbers effect -->
  <text x="38" y="19" font-family="monospace" font-size="6" fill="#131414" font-weight="bold" text-anchor="end">88888</text>
  
  <!-- Calculator buttons grid (3x4) -->
  <g opacity="0.9">
    <!-- Row 1 -->
    <rect x="20" y="26" width="5" height="5" rx="1" fill="#fff"/>
    <rect x="20" y="26" width="5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
    <rect x="27.5" y="26" width="5" height="5" rx="1" fill="#fff"/>
    <rect x="27.5" y="26" width="5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
    <rect x="35" y="26" width="5" height="5" rx="1" fill="#fff"/>
    <rect x="35" y="26" width="5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
    
    <!-- Row 2 -->
    <rect x="20" y="33" width="5" height="5" rx="1" fill="#fff"/>
    <rect x="20" y="33" width="5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
    <rect x="27.5" y="33" width="5" height="5" rx="1" fill="#fff"/>
    <rect x="27.5" y="33" width="5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
    <rect x="35" y="33" width="5" height="5" rx="1" fill="#fff"/>
    <rect x="35" y="33" width="5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
    
    <!-- Row 3 -->
    <rect x="20" y="40" width="5" height="5" rx="1" fill="#fff"/>
    <rect x="20" y="40" width="5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
    <rect x="27.5" y="40" width="5" height="5" rx="1" fill="#fff"/>
    <rect x="27.5" y="40" width="5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
    <rect x="35" y="40" width="5" height="5" rx="1" fill="#fff"/>
    <rect x="35" y="40" width="5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
    
    <!-- Row 4 -->
    <rect x="20" y="47" width="12.5" height="5" rx="1" fill="#fff"/>
    <rect x="20" y="47" width="12.5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
    <rect x="35" y="47" width="5" height="5" rx="1" fill="#fff"/>
    <rect x="35" y="47" width="5" height="5" rx="1" stroke="#131414" stroke-width="1"/>
  </g>
  
  <!-- Rupee symbol on special button -->
  <text x="22.5" y="30" font-family="Arial" font-size="4" fill="#131414" font-weight="bold">₹</text>
  
  <!-- Shine effect on screen -->
  <path d="M21 13C21 13 24 12 28 12" stroke="#42ffa1" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  
  <defs>
    <radialGradient id="calc-radial" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#42ffa1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#42ffa1" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
